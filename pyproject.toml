[project]
name = "certan-ai"
version = "0.1.0"
description = "Toba Copilot: Enterprise AI Copilot untuk perencanaan wisata terpadu Danau Toba (10S3001 Kecerdasan Buatan, IT Del)"
readme = "README.md"
authors = [
    { name = "Michael Pratama Nasution", email = "nasutionkale@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "fastmcp>=4.0.4",
    "google-genai>=2.24.0",
    "gradio>=6.27.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "pydantic>=2.13.5",
    "pypdf>=6.21.4",
    "sentence-transformers>=6.2.0",
]

[project.scripts]
certan-ai = "certan_ai:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

[tool.pyright]
extraPaths = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
